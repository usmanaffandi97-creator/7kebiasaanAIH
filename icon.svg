<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.1" />

  <!-- Badge Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Shield / Badge Base -->
    <path d="M 256,90 L 380,140 C 380,260 256,360 256,360 C 256,360 132,260 132,140 Z" fill="#ffffff" />
    
    <!-- Indonesian Flag Top Half inside Shield -->
    <path d="M 256,90 L 380,140 C 380,195 340,240 256,245 C 172,240 132,195 132,140 Z" fill="url(#flagRed)" />
    
    <!-- White Half bottom inside shield already white -->
  </g>

  <!-- Number 7 Star Badge -->
  <circle cx="256" cy="220" r="68" fill="url(#gold)" filter="url(#shadow)" stroke="#ffffff" stroke-width="6" />

  <!-- Big Number 7 -->
  <text x="256" y="248" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" fill="#1e293b" text-anchor="middle">7</text>

  <!-- 7 Mini Stars around bottom shield -->
  <g fill="#facc15" stroke="#ca8a04" stroke-width="1.5">
    <!-- Star 1 -->
    <path d="M 170,360 L 174,372 L 186,372 L 176,380 L 180,392 L 170,384 L 160,392 L 164,380 L 154,372 L 166,372 Z" transform="scale(0.8) translate(30, 60)" />
    <!-- Star 2 -->
    <path d="M 210,380 L 214,392 L 226,392 L 216,400 L 220,412 L 210,404 L 200,412 L 204,400 L 194,392 L 206,392 Z" transform="scale(0.8) translate(40, 50)" />
    <!-- Star 3 -->
    <path d="M 256,390 L 260,402 L 272,402 L 262,410 L 266,422 L 256,414 L 246,422 L 250,410 L 240,402 L 252,402 Z" transform="scale(0.9) translate(28, 40)" />
    <!-- Star 4 -->
    <path d="M 302,380 L 306,392 L 318,392 L 308,400 L 312,412 L 302,404 L 292,412 L 296,400 L 286,392 L 298,392 Z" transform="scale(0.8) translate(50, 50)" />
    <!-- Star 5 -->
    <path d="M 342,360 L 346,372 L 358,372 L 348,380 L 352,392 L 342,384 L 332,392 L 336,380 L 326,372 L 338,372 Z" transform="scale(0.8) translate(60, 60)" />
  </g>

  <!-- Banner text: ANAK INDONESIA HEBAT -->
  <g filter="url(#shadow)">
    <rect x="76" y="405" width="360" height="46" rx="23" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
    <text x="256" y="435" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="1.5">ANAK INDONESIA HEBAT</text>
  </g>
</svg>
